name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC: new advisories and runner changes show up without a push
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every job runs on a CPython that uv itself provides (the latest 3.12.x and 3.14.x it knows),
  # never on a Python that ships with the runner image: Linux and Windows test the same patch
  # releases, and a runner image change cannot swap the interpreter.
  UV_MANAGED_PYTHON: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q -n auto --cov=potakt --cov-report=term-missing

  security:
    name: security (zizmor, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      # The audit tools resolve as of the --exclude-newer date; move it when their versions change.
      - name: Audit the workflows (zizmor)
        run: uvx --exclude-newer 2026-11-10T00:00:00Z zizmor@1.32.0 --offline .github

      - name: Audit the locked dependencies (pip-audit)
        working-directory: python
        run: |
          uv export --quiet --locked --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements-audit.txt"
          uvx --exclude-newer 2026-11-10T00:00:00Z pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements-audit.txt" --require-hashes --disable-pip --strict --progress-spinner off

      - name: Repository hygiene
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/hygiene.sh "$BASE"
